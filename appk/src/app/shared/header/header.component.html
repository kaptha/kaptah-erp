<mat-toolbar class="header">
  <button mat-icon-button (click)="toggleSidebar()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="spacer"></span>

  <!-- Cambio rapido de cuenta: solo si el usuario tiene acceso a mas de una -->
  @if (accounts.length > 1) {
    <button mat-button class="account-switch" [matMenuTriggerFor]="accountMenu" [disabled]="switchingAccount">
      <mat-icon>business</mat-icon>
      <span class="account-switch-name">{{ activeCuentaNombre }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #accountMenu="matMenu" class="account-menu">
      <div class="account-menu-title">Cambiar de empresa</div>
      <mat-divider></mat-divider>
      @for (account of accounts; track account.cuentaFirebaseUid) {
        <button mat-menu-item (click)="switchAccount(account)" [disabled]="account.cuentaFirebaseUid === activeCuentaUid">
          <mat-icon>{{ account.cuentaFirebaseUid === activeCuentaUid ? 'check_circle' : 'business' }}</mat-icon>
          <span class="account-item">
            <span class="account-item-name">{{ account.nombreCuenta }}</span>
            <span class="account-item-role">{{ account.rol }}</span>
          </span>
        </button>
      }
    </mat-menu>
  }

  <button mat-icon-button [matMenuTriggerFor]="settingsMenu">
    <mat-icon>settings</mat-icon>
  </button>
  <mat-menu #settingsMenu="matMenu">
    <button mat-menu-item [routerLink]="['/dashboard/perfil']">
      <mat-icon>account_circle</mat-icon>
      <span>Mi cuenta</span>
    </button>
    <button mat-menu-item [routerLink]="['/dashboard/cfdi']">
      <mat-icon>receipt</mat-icon>
      <span>Facturas</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>

  <!-- Avatar con iniciales estilo Gmail -->
  <button mat-icon-button class="user-profile" [matMenuTriggerFor]="userMenu">
    <div class="user-avatar">
      {{ getUserInitials() }}
    </div>
  </button>

  <!-- Menu del usuario -->
  <mat-menu #userMenu="matMenu">
    <div class="user-menu-header">
      <div class="user-avatar-large">
        {{ getUserInitials() }}
      </div>
      <div class="user-info">
        <div class="user-full-name">{{ userName || 'Usuario' }}</div>
        @if (accounts.length > 1) {
          <div class="user-active-account">{{ activeCuentaNombre }}</div>
        }
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item [routerLink]="['/dashboard/perfil']">
      <mat-icon>manage_accounts</mat-icon>
      <span>Gestionar cuenta</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
