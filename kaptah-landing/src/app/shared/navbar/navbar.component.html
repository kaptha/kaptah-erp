<mat-toolbar
  class="navbar"
  [class.scrolled]="scrolled">

  <div class="navbar-container">

    <div class="logo-container">
      <img
        src="assets/logo-kaptah-white.svg"
        alt="Kaptah"
        class="logo" />
    </div>

    <nav class="nav-links">
      <a href="#benefits">Caracteristicas</a>
      <a href="#pricing">Planes</a>
      <a href="#testimonials">Testimonios</a>
      <a href="#contact">Contacto</a>
    </nav>

    <div class="actions">
      <a href="https://app.kaptah.mx/login" mat-button class="login-btn">Iniciar sesion</a>
      <a href="https://app.kaptah.mx/register" mat-raised-button class="cta-btn">Probar gratis</a>
    </div>

    <button class="mobile-menu-btn" (click)="toggleMenu()">
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
    </button>

  </div>

</mat-toolbar>

<div class="mobile-menu" [class.open]="menuOpen">
  <div class="mobile-menu-content">
    <a href="#benefits" (click)="closeMenu()">Caracteristicas</a>
    <a href="#pricing" (click)="closeMenu()">Planes</a>
    <a href="#testimonials" (click)="closeMenu()">Testimonios</a>
    <a href="#contact" (click)="closeMenu()">Contacto</a>
    <a href="https://app.kaptah.mx/login" mat-button class="mobile-login" (click)="closeMenu()">Iniciar sesion</a>
    <a href="https://app.kaptah.mx/register" mat-raised-button class="mobile-cta" (click)="closeMenu()">Probar gratis</a>
  </div>
</div>

<div class="backdrop" [class.open]="menuOpen" (click)="closeMenu()"></div>
